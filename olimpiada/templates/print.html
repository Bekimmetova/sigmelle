<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>Masalalar — {{ contest_title }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>body{background:#fff}.statement{box-shadow:none;border:none;page-break-after:always;max-width:800px;margin:0 auto}</style>
</head><body>
<h1 class="center" style="margin:24px 0">{{ contest_title }}</h1>
{% for p in problems %}
<article class="card statement">
  <div class="ptitle"><span class="pid big">{{ p.id }}</span><h2>{{ p.title }}</h2></div>
  <p class="limits"><span>Vaqt: {{ p.time_limit }} s</span><span>Xotira: {{ p.memory_limit }} MB</span><span>Ball: {{ p.points }}</span></p>
  {{ p.statement|safe }}
  <h3>Misollar</h3>
  {% for i, o in p.samples %}
  <div class="sample"><div><div class="slabel">Kiruvchi</div><pre>{{ i }}</pre></div><div><div class="slabel">Chiquvchi</div><pre>{{ o }}</pre></div></div>
  {% endfor %}
</article>
{% endfor %}
<script>window.print()</script>
</body></html>
