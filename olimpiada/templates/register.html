{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>Ro'yxatdan o'tish</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>F.I.Sh.<input name="full_name" required placeholder="Aliyev Vali" value="{{ request.form.full_name }}"></label>
    <label>Guruh<input name="group_name" required placeholder="211-22" value="{{ request.form.group_name }}"></label>
    <label>Login<input name="username" required placeholder="vali_aliyev" value="{{ request.form.username }}"></label>
    <label>Parol<input name="password" type="password" required minlength="6"></label>
    <button class="btn full">Ro'yxatdan o'tish</button>
  </form>
</div>
{% endblock %}
